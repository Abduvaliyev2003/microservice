version: '3'

services:
  backend:
    build:
      context: .

    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    command: sh -c "sleep 15 &&  python manage.py runserver 0.0.0.0:8000"


  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: 'python consumer.py'
    depends_on:
      - db

  db:
    image: mysql:8.0.46
    restart: always
    environment:
      MYSQL_DATABASE: admin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "33066:3306"

volumes:
  dbdata: